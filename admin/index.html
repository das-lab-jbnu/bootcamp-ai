<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <title>관리자 페이지 | 방산 AI 부트캠프</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="../assets/js/config.js"></script>
  <script defer src="../assets/js/admin.js"></script>
  <style>
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #d1d5db;
      transition: .3s;
      border-radius: 18px;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      top: 2px;
      background: white;
      transition: .3s;
      border-radius: 50%;
    }

    .switch input:checked+.slider {
      background: #2563eb;
    }

    .switch input:checked+.slider:before {
      transform: translateX(14px);
    }
  </style>
</head>

<body>
  <h1>방산AI부트캠프 관리자 페이지</h1>

  <section id="login-area">
    <input id="admin-password" type="password" placeholder="관리자 비밀번호" />
    <button id="login-btn" type="button">확인</button>
  </section>

  <section id="admin-area" hidden>
    <div style="display:flex; gap:24px; margin-top:20px;">

      <!-- 왼쪽 메뉴 -->
      <aside style="width:280px; border:1px solid #ddd; padding:16px;">
        <h2>교과목 목록</h2>

        <button id="add-program-btn" type="button" style="width:100%; margin-bottom:12px;">
          + 교과목 추가
        </button>

        <div id="program-menu">

        </div>

        <hr>

        <button type="button" style="width:100%;">
          신청자 조회
        </button>
      </aside>

      <!-- 오른쪽 화면 -->
      <main style="flex:1; border:1px solid #ddd; padding:20px;">
        <h2 id="selected-program-title">교과목을 선택하세요</h2>

        <!-- 탭 메뉴 -->
        <div style="display:flex; gap:8px; margin-bottom:20px;">
          <button class="tab-btn" data-tab="basic" type="button">기본정보</button>
          <button class="tab-btn" data-tab="schedule" type="button">일정</button>
          <button class="tab-btn" data-tab="syllabus" type="button">강의계획서</button>
          <button class="tab-btn" data-tab="setting" type="button">접수설정</button>
          <button class="tab-btn" data-tab="status" type="button">신청현황</button>
        </div>

        <hr>

        <!-- 기본정보 -->
        <section id="tab-basic" class="tab-content">
          <h3>기본정보</h3>

          <label>교과목명</label><br>
          <input id="program-name" type="text" style="width:100%;"><br><br>

          <label>달력 표시명</label><br>
          <input id="program-calendar-name" type="text" placeholder="예: 보안, MOSA, LLM, 군수" style="width:100%;"><br><br>

          <label>달력 표시 색상</label>

          <div id="calendar-color-picker" class="calendar-color-picker">

            <button type="button" class="calendar-color active" data-color="bg-blue-600"
              style="background:#2563eb"></button>

            <button type="button" class="calendar-color" data-color="bg-sky-500" style="background:#0ea5e9"></button>

            <button type="button" class="calendar-color" data-color="bg-cyan-600" style="background:#0891b2"></button>

            <button type="button" class="calendar-color" data-color="bg-emerald-600"
              style="background:#059669"></button>

            <button type="button" class="calendar-color" data-color="bg-lime-500" style="background:#84cc16"></button>

            <button type="button" class="calendar-color" data-color="bg-yellow-400" style="background:#facc15"></button>

            <button type="button" class="calendar-color" data-color="bg-amber-500" style="background:#f59e0b"></button>

            <button type="button" class="calendar-color" data-color="bg-orange-500" style="background:#f97316"></button>

            <button type="button" class="calendar-color" data-color="bg-red-600" style="background:#dc2626"></button>

            <button type="button" class="calendar-color" data-color="bg-rose-500" style="background:#f43f5e"></button>

            <button type="button" class="calendar-color" data-color="bg-pink-500" style="background:#ec4899"></button>

            <button type="button" class="calendar-color" data-color="bg-violet-600" style="background:#7c3aed"></button>

            <button type="button" class="calendar-color" data-color="bg-fuchsia-600"
              style="background:#c026d3"></button>

            <button type="button" class="calendar-color" data-color="bg-indigo-600" style="background:#4f46e5"></button>

            <button type="button" class="calendar-color" data-color="bg-slate-600" style="background:#475569"></button>

          </div>

          <br>

          <label>교과목 설명</label><br>
          <textarea id="program-description" style="width:100%; height:80px;"></textarea><br><br>

          <label style="display:flex; align-items:center; gap:12px;">
            <span>접수페이지 노출</span>

            <label class="switch">
              <input id="program-visible" type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </label>
        </section>

        <!-- 일정 -->
        <section id="tab-schedule" class="tab-content" hidden>
          <h3>일정</h3>

          <label>교육기간</label><br>

          <div id="schedule-period-list">
            <div class="schedule-period" style="display:flex; gap:8px; margin-bottom:8px;">
              <input class="period-start-date" type="date">
              <span>~</span>
              <input class="period-end-date" type="date">
              <button class="remove-period-btn" type="button">삭제</button>
            </div>
          </div>

          <button id="add-period-btn" type="button">
            + 교육기간 추가
          </button>

          <br><br>

          <label>교육시간</label><br>
          <input id="program-time" type="text" style="width:100%;"><br><br>

          <label>교육장소</label><br>
          <input id="program-location" type="text" placeholder="예: 전북대학교 창조2관" style="width:100%;">
        </section>

        <!-- 강의계획서 -->
        <section id="tab-syllabus" class="tab-content" hidden>
          <h3>강의계획서</h3>

          <label>강의계획서 HTML 파일명</label><br>
          <input id="program-syllabus" type="text" placeholder="예) defense-ai-autonomous-security.html"
            style="width:100%;">

          <p style="margin-top:8px; font-size:13px; color:#666;">
            ※ curriculum/syllabi 폴더에 업로드한 HTML 파일명을 입력하세요.
          </p>

          <button id="check-syllabus-btn" type="button" style="margin-top:8px;">
            파일 연결 확인
          </button>

          <p id="syllabus-check-message" style="margin-top:8px; font-size:13px;"></p>

          <p style="margin-top:8px; font-size:13px; color:#666;">
            예) defense-ai-autonomous-security.html
          </p>
        </section>

        <!-- 접수설정 -->
        <section id="tab-setting" class="tab-content" hidden>
          <h3>접수설정</h3>

          <label>신청 시작일</label><br>
          <input id="apply-start-date" type="date" value="2026-06-01"><br><br>

          <label>신청 종료일</label><br>
          <input id="apply-end-date" type="date" value="2026-06-30"><br><br>

          <label style="display:flex; align-items:center; gap:12px;">
            <span>접수 상태</span>

            <label class="switch">
              <input id="program-open" type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </label>
        </section>

        <!-- 신청현황 -->
        <section id="tab-status" class="tab-content" hidden>
          <h3>신청현황</h3>

          <p>정원: 30명</p>
          <p>신청인원: 0명</p>
          <p>잔여인원: 30명</p>

          <button type="button">신청자 명단 보기</button>
          <button type="button">엑셀 다운로드</button>
        </section>

        <br>

        <button id="save-program-btn" type="button">저장</button>
        <button id="delete-program-btn" type="button">삭제</button>
      </main>
    </div>
  </section>

  <p id="message"></p>
</body>

</html>
