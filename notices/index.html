<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지사항 | 전북대 방산 AI 부트캠프</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="page-wrap">
      <header id="site-header"></header>
      <main class="mx-auto w-full max-w-6xl px-4 py-12">
        <div class="border-b border-slate-200 pb-7">
          <p class="text-sm font-bold tracking-widest text-blue-700">NOTICE</p>
          <h1 class="section-title mt-2 text-3xl font-bold">공지사항</h1>
          <p class="mt-3 text-base leading-7 text-slate-600">프로그램 신청, 특강·세미나 일정과 사업단 소식을 확인하세요.</p>
        </div>

        <section class="mt-8" aria-label="공지사항 목록">
          <div id="notice-filters" class="flex flex-wrap gap-2" role="group" aria-label="공지 분류"></div>
          <p id="notice-count" class="mt-8 text-sm font-semibold text-slate-600" aria-live="polite"></p>
          <div id="notice-list" class="mt-3 divide-y divide-slate-200 border-y border-slate-200"></div>
          <p id="notice-empty" class="hidden py-14 text-center text-slate-500">등록된 공지사항이 없습니다.</p>
        </section>
      </main>
      <footer id="site-footer"></footer>
    </div>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/notices-data.js"></script>
    <script src="../assets/js/notices.js"></script>
  </body>
</html>
