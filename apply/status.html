<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신청 확인/변경/취소 | 전북대 방산 AI 부트캠프</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="page-wrap">
      <header id="site-header"></header>
      <main class="mx-auto max-w-6xl px-4 py-12">
        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
          <div>
            <h1 class="section-title text-3xl font-bold">신청 확인/변경/취소</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600">
              경진대회와 신규 초급과정 신청에 사용한 이메일을 인증한 후 신청 내역을 관리할 수 있습니다.
              이전 프로그램 접수내역은 조회되지 않습니다.
            </p>
          </div>
          <a class="inline-flex w-fit items-center justify-center border border-blue-900 px-5 py-2 text-sm font-semibold text-blue-900 hover:bg-blue-50" href="./index.html">프로그램 목록</a>
        </div>

        <section class="mt-10 border-t-2 border-blue-900 bg-slate-50 px-4 py-6 md:px-6" aria-labelledby="verification-title">
          <h2 class="text-xl font-bold text-slate-950" id="verification-title">신청 이메일 인증</h2>
          <p class="mt-2 text-sm text-slate-600">인증번호는 10분 동안 유효하며, 인증 후 15분 동안 신청 내역을 관리할 수 있습니다.</p>

          <form class="mt-5 grid gap-4 md:grid-cols-[minmax(0,1fr)_auto] md:items-end" id="email-form" novalidate>
            <div class="grid gap-2">
              <label class="text-sm font-semibold text-slate-800" for="lookup-email">신청 이메일</label>
              <input class="apply-field" id="lookup-email" name="email" type="email" autocomplete="email" maxlength="254" required />
            </div>
            <button class="inline-flex min-w-36 items-center justify-center bg-blue-900 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:bg-slate-400" id="send-code-button" type="submit">
              <span class="apply-spinner mr-2" aria-hidden="true"></span>
              <span data-send-code-text>인증번호 받기</span>
            </button>
          </form>

          <form class="mt-5 hidden grid gap-4 border-t border-slate-200 pt-5 md:grid-cols-[minmax(0,1fr)_auto] md:items-end" id="code-form" novalidate>
            <div class="grid gap-2">
              <label class="text-sm font-semibold text-slate-800" for="verification-code">인증번호 6자리</label>
              <input class="apply-field" id="verification-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required />
            </div>
            <button class="inline-flex min-w-36 items-center justify-center bg-emerald-700 px-5 py-3 text-sm font-semibold text-white hover:bg-emerald-600 disabled:cursor-not-allowed disabled:bg-slate-400" id="verify-code-button" type="submit">
              <span class="apply-spinner mr-2" aria-hidden="true"></span>
              <span data-verify-code-text>인증하기</span>
            </button>
          </form>
          <p class="mt-4 hidden rounded-lg px-4 py-3 text-sm" id="status-message" role="status" aria-live="polite"></p>
        </section>

        <section class="mt-8 hidden" id="status-results" aria-labelledby="results-title">
          <div class="flex flex-col gap-2 border-b border-slate-300 pb-4 md:flex-row md:items-end md:justify-between">
            <div>
              <h2 class="text-2xl font-bold text-slate-950" id="results-title">신청 내역</h2>
              <p class="mt-1 text-sm text-slate-600">상태가 ‘접수’인 신청만 온라인 변경·취소가 가능합니다.</p>
            </div>
            <button class="w-fit border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" id="refresh-button" type="button">새로고침</button>
          </div>
          <div class="mt-5 overflow-x-auto border border-slate-200">
            <table class="min-w-full divide-y divide-slate-200 bg-white text-sm">
              <thead class="bg-slate-100 text-left text-slate-800">
                <tr>
                  <th class="px-4 py-3 font-semibold">접수번호</th>
                  <th class="px-4 py-3 font-semibold">구분</th>
                  <th class="px-4 py-3 font-semibold">프로그램</th>
                  <th class="px-4 py-3 font-semibold">상태</th>
                  <th class="px-4 py-3 font-semibold">접수 시각</th>
                  <th class="px-4 py-3 font-semibold">관리</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200" id="status-list"></tbody>
            </table>
          </div>
        </section>
      </main>

      <div class="apply-modal" id="edit-modal" hidden>
        <div class="apply-modal__backdrop" data-edit-close></div>
        <section class="apply-modal__dialog max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title" tabindex="-1">
          <div class="sticky top-0 z-10 flex items-start justify-between gap-4 border-b border-slate-200 bg-white px-5 py-4">
            <div>
              <h2 class="text-xl font-bold text-slate-950" id="edit-modal-title">신청 내용 변경</h2>
              <p class="mt-1 text-sm text-slate-600" id="edit-modal-description"></p>
            </div>
            <button class="inline-flex h-9 w-9 items-center justify-center border border-slate-300 text-xl leading-none text-slate-600 hover:bg-slate-100" type="button" aria-label="변경 화면 닫기" data-edit-close>&times;</button>
          </div>
          <form class="grid gap-5 px-5 py-5" id="edit-form" novalidate>
            <input id="edit-application-id" name="application_id" type="hidden" />
            <div class="grid gap-4" id="edit-fields"></div>
            <p class="hidden rounded-lg px-4 py-3 text-sm" id="edit-message" role="status" aria-live="polite"></p>
            <div class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-4 sm:flex-row sm:justify-end">
              <button class="inline-flex items-center justify-center border border-slate-300 px-5 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" type="button" data-edit-close>닫기</button>
              <button class="inline-flex min-w-32 items-center justify-center bg-blue-900 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:bg-slate-400" id="edit-submit" type="submit">
                <span class="apply-spinner mr-2" aria-hidden="true"></span>
                <span data-edit-text>변경 저장</span>
              </button>
            </div>
          </form>
        </section>
      </div>

      <footer id="site-footer"></footer>
    </div>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/status.js"></script>
  </body>
</html>
