<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로그램 신청/접수 | 전북대 방산 AI 부트캠프</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
  <div class="page-wrap">
    <header id="site-header"></header>
    <main class="max-w-6xl mx-auto px-4 py-12">
      <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <h1 class="section-title text-3xl font-bold">프로그램 신청/접수</h1>
        <a class="inline-flex w-fit items-center justify-center border border-blue-900 px-5 py-2 text-sm font-semibold text-blue-900 hover:bg-blue-50"
          href="./status.html">
          신청 내역 조회
        </a>
      </div>

      <section class="mt-8 border-t-2 border-blue-900 bg-white px-4 py-5 shadow-sm md:px-6">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <h2 class="text-xl font-bold text-slate-950">교육 일정 한눈에 보기</h2>
            <p class="mt-1 text-sm text-slate-600">월별 교육일정을 확인할 수 있습니다.</p>
          </div>

          <div class="flex items-center gap-2">
            <button id="prev-month-btn" type="button" class="border px-3 py-1 text-sm">이전 달</button>
            <strong id="calendar-title" class="min-w-28 text-center text-blue-950"></strong>
            <button id="next-month-btn" type="button" class="border px-3 py-1 text-sm">다음 달</button>
          </div>
        </div>

        <div id="calendar-area" class="mt-5"></div>
      </section>

      <section id="program-card-list" class="mt-10 space-y-6"></section>
    </main>

    <div class="apply-modal" id="apply-modal" hidden>
      <div class="apply-modal__backdrop" data-apply-close></div>
      <section class="apply-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="apply-modal-title"
        tabindex="-1">
        <div class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4">
          <div>
            <h2 id="apply-modal-title" class="text-xl font-bold text-slate-950">프로그램 신청</h2>
            <p class="mt-1 text-sm text-slate-600">선택한 프로그램 정보가 자동으로 포함됩니다.</p>
          </div>
          <button
            class="inline-flex h-9 w-9 items-center justify-center border border-slate-300 text-xl leading-none text-slate-600 hover:bg-slate-100"
            type="button" aria-label="신청 폼 닫기" data-apply-close>
            &times;
          </button>
        </div>

        <form class="grid gap-4 px-5 py-5" id="apply-form" novalidate>
          <div class="grid gap-4 md:grid-cols-2">
            <div class="grid gap-2">
              <label class="text-sm font-semibold text-slate-800" for="applicant-name">이름</label>
              <input class="apply-field" id="applicant-name" name="name" type="text" autocomplete="name" required />
            </div>

            <div class="grid gap-2">
              <label class="text-sm font-semibold text-slate-800" for="organization">소속</label>
              <input class="apply-field" id="organization" name="organization" type="text" required />
            </div>
          </div>

          <div class="grid gap-4 md:grid-cols-2">
            <div class="grid gap-2">
              <label class="text-sm font-semibold text-slate-800" for="student-id">학번</label>
              <input class="apply-field" id="student-id" name="student_id" type="text" inputmode="numeric" required />
            </div>

            <div class="grid gap-2">
              <label class="text-sm font-semibold text-slate-800" for="student-grade">학년</label>
              <input class="apply-field" id="student-grade" name="grade" type="text" required />
            </div>
          </div>

          <div class="grid gap-4">

            <div class="grid gap-4 md:grid-cols-2">

              <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-800" for="apply-email">
                  이메일
                </label>

                <input class="apply-field" id="apply-email" name="email" type="email" required />
              </div>

              <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-800" for="apply-phone">
                  연락처
                </label>

                <input class="apply-field" id="apply-phone" name="phone" type="tel" required />
              </div>

            </div>

            <p class="text-xs font-medium text-red-600">
              ※ 신청 내역 조회 및 수정 시 사용하는 이메일입니다. 신청 완료 후에는 변경할 수 없으므로 정확하게 입력해 주세요.
            </p>

          </div>

          <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-800" for="program-name">프로그램명</label>
            <input class="apply-field bg-slate-100 text-slate-700" id="program-name" name="program" type="text" readonly
              required />
          </div>

          <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-800" for="motivation">자기소개 / 지원동기</label>
            <textarea class="apply-field min-h-32 resize-y" id="motivation" name="motivation" required></textarea>
            <p id="apply-message" class="hidden text-sm" role="status" aria-live="polite"></p>
            <div class="flex justify-end gap-3 border-t border-slate-200 pt-4">
              <button type="button" data-apply-close class="border px-4 py-2">
                취소
              </button>
              <button id="apply-submit" type="submit" class="bg-blue-900 px-4 py-2 text-white">
                <span data-submit-text>제출하기</span>
              </button>
            </div>
          </div>
        </form>
      </section>
    </div>
    <footer id="site-footer"></footer>
  </div>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apply.js"></script>
</body>

</html>
